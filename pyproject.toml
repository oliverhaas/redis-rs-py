[project]
name = "redis-rs-py"
version = "0.1.0a1"
description = "High-performance, drop-in replacement for redis-py and valkey-py, built on PyO3 + tokio + redis-rs"
readme = "README.md"
license = { text = "MIT" }
# v0.1 ships cp314 + cp314t only. Rationale:
#   * the Rust core uses 2024-edition syntax (`if let ... && ...` chains)
#     and PyO3 0.28 free-threading APIs that exist in cp313+ only;
#   * the Python `__init__.py`/`.pyi` tree leans on cp314 type-stub features;
#   * dropping to cp310 (per PLAN.md's prebuilt-wheel target) is multi-day
#     work that buys nothing concrete until users on older interpreters
#     ask for it.
# Revisit for v0.2 once the API surface has stabilised and there's measured
# demand. See docs/RELEASING.md and docs/superpowers/plans/19-distribution.md.
requires-python = ">=3.14"
keywords = ["redis", "valkey", "rust", "pyo3", "client"]
authors = [{ name = "Oliver Haas", email = "ohaas@e1plus.de" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 1 - Unstable",
  "Programming Language :: Rust",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/oliverhaas/redis-rs-py"
Repository = "https://github.com/oliverhaas/redis-rs-py.git"
Issues = "https://github.com/oliverhaas/redis-rs-py/issues"

[dependency-groups]
dev = [
  "maturin==1.14.1",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  "ruff==0.16.2",
  "testcontainers==4.15.0",
  "ty==0.0.71",
  # Reference clients used by the parity test suite
  "redis==7.4.0",
  "valkey==6.1.1",
]
bench = [
  "pytest-codspeed==5.0.3",
  "redis[hiredis]==7.4.0",
  "valkey-glide==2.5.1",
]

[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "redis_rs_py._driver"
features = ["pyo3/extension-module"]
python-source = "python"
manifest-path = "crates/redis-rs-py-driver/Cargo.toml"
include = ["LICENSE"]

[tool.ruff]
target-version = "py314"
line-length = 120
fix = true

[tool.ruff.format]
# Recent ruff formats Python code blocks inside Markdown. The plan documents are
# frozen historical records, so reformatting them is pure churn.
exclude = ["docs/superpowers/plans/*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "A001",    # Exception names like ConnectionError intentionally shadow builtins (redis-py API)
  "A002",    # min/max param names match Redis API (ZCOUNT key min max, etc.)
  "A003",    # Method names like `set`/`type` mirror the Redis API
  "A004",    # Imports like ConnectionError/TimeoutError intentionally shadow builtins (redis-py API)
  "N818",    # InvalidResponse follows redis-py naming; does not need Error suffix
  "ANN401",  # Any is correct for arbitrary Redis values
  "COM812",  # Conflicts with ruff-format
  "CPY001",  # MIT licence lives in LICENSE; no per-file copyright headers
  "D",       # Docstrings — add incrementally
  "E501",    # Line length handled by config
  "EM",      # Inline exception strings are fine
  "FBT",     # Boolean params match Redis API
  "PLR0913", # Many args expected for Redis commands with options
  "PLR2004", # Magic values like -2 for TTL are Redis-documented
  "TRY003",  # Long exception messages help debugging
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-none-returning = true

# `from __future__ import annotations` is unnecessary for our py314 floor and
# actively harmful — it forces every annotation into a string, breaking the
# runtime introspection that dataclasses/pydantic/etc rely on. PEP 649 in 3.14
# already provides deferred-evaluation semantics natively.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Not needed on py314 (PEP 649); strings break runtime annotation introspection."

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ANN",
  "ARG",
  "B017",    # blind pytest.raises(Exception) is intentional in integration tests
  "BLE001",  # broad exception catches are intentional in fault-tolerance tests
  "F811",    # pytest `as lk` rebinds are intentional
  "F841",
  "FBT",
  "PLC0415", # imports inside test functions are a common pytest pattern
  "PT006",
  "PT011",
  "PT012",   # multi-statement pytest.raises blocks are intentional
  "PT013",
  "PT018",
  "PT017",   # assert-in-except is used for nuanced exception filtering
  "S101",
  "S105",
  "S106",    # test passwords are intentionally hard-coded
  "S110",    # try-except-pass is intentional in fault-tolerance tests
]
"benchmarks/**" = [
  "ANN",
  "ARG",
  "BLE001",
  "EXE001",
  "N806",
  "PERF102",
  "PERF401",
  "PLC0415",
  "S101",
  "S603",
  "SIM108",
  "T201",
  "TC001",
  "TC003",
]
"python/redis_rs_py/_driver.pyi" = [
  "N801",   # `class exceptions:` mirrors redis.exceptions module name
  "PYI021", # docstrings in stubs are useful for IDE tooling
  "PYI034", # __new__/__enter__ return types match the generated stub verbatim
]

[tool.ty.environment]
python-version = "3.14"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"

[tool.pytest.ini_options]
# -n auto: run tests in parallel by default (use -n 0 or -p no:xdist to override).
#   The fixtures are hermetic — per-worker Valkey DB isolation in conftest.py.
# --maxprocesses=15: testcontainers Valkey ships 16 numbered DBs (0-15); each
#   worker takes one DB slot for isolation (see conftest.py::_worker_db), and
#   DB 15 is reserved as the destination for cross-DB tests like
#   test_copy_with_db_to_other_db so they don't race a worker's FLUSHDB.
# --dist=loadgroup: required for `pytest.mark.xdist_group` to take effect.
#   Tests sharing a group land on the same worker. Used by
#   test_commands_scripts.py and test_commands_admin.py to serialise tests
#   that touch server-global state (script cache, function library, etc.).
addopts = "--cov=redis_rs_py --cov-report=term-missing --cov-report=xml --no-cov-on-fail -n auto --maxprocesses=15 --dist=loadgroup"
testpaths = ["tests"]
xfail_strict = true
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
precision = 2
skip_covered = true
