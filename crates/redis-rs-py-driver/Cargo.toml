[package]
name = "redis-rs-py-driver"
version = "0.1.0-alpha.1"
edition = "2024"
description = "Rust I/O driver for redis-rs-py — PyO3 + tokio + redis-rs"
license = "MIT"
repository = "https://github.com/oliverhaas/redis-rs-py"
# We never publish the driver crate to crates.io. It only ships as the
# compiled extension module bundled into the redis-rs-py wheel via
# maturin. Publishing the source crate would invite use as a Rust
# dependency, which it isn't designed for (Python-only embedded API,
# no semver guarantees on the Rust side).
publish = false

[lib]
name = "_driver"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = [
  "extension-module",
  "multiple-pymethods",
] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "sync",
  "time",
  "macros",
] }
redis = { version = "1", features = [
  "tokio-comp",
  "connection-manager",
  "cluster",
  "cluster-async",
  "tokio-rustls-comp",
  "tls-rustls-insecure",
  "cache-aio",
] }
rustls = { version = "0.23", features = ["ring"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
lto = true
strip = true
