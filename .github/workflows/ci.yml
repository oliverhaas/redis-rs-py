name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: uv sync --group dev

      - name: ruff check
        run: uv run ruff check

      - name: ruff format check
        run: uv run ruff format --check

      - name: ty check
        run: uv run ty check python/redis_rs_py/

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -n auto

      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build-wheels:
    name: Build wheels (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            cibw_archs: x86_64
            cibw_build: cp314-manylinux_x86_64 cp314t-manylinux_x86_64
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            cibw_archs: aarch64
            cibw_build: cp314-manylinux_aarch64 cp314t-manylinux_aarch64
          - os: macos-14
            label: macos-arm64
            cibw_archs: arm64
            cibw_build: cp314-macosx_arm64 cp314t-macosx_arm64
          - os: windows-latest
            label: windows-amd64
            cibw_archs: AMD64
            cibw_build: cp314-win_amd64 cp314t-win_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_ENABLE: cpython-freethreading
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          # Linux builds run inside manylinux containers — install Rust there.
          # macOS and Windows runners have rustup preinstalled.
          CIBW_BEFORE_ALL_LINUX: |
            curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          CIBW_ENVIRONMENT_LINUX: PATH="$HOME/.cargo/bin:$PATH"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.label }}
          path: wheelhouse/*.whl

  smoke-test-wheel:
    name: Smoke-test wheel (cp314 linux-x86_64)
    needs: [build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x86_64
          path: wheelhouse

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Install wheel
        run: |
          uv venv --python 3.14
          uv pip install --no-deps wheelhouse/redis_rs_py-*-cp314-cp314-*.whl

      - name: Verify import
        run: uv run --no-sync python -c "from redis_rs_py import _driver; print('OK', _driver.__version__)"

  smoke-test-wheel-freethreaded:
    name: Smoke-test cp314t free-threaded wheel
    needs: [build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x86_64
          path: wheelhouse

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up free-threaded Python
        run: uv python install 3.14t

      - name: Install wheel
        run: |
          uv venv --python 3.14t
          uv pip install --no-deps wheelhouse/redis_rs_py-*-cp314-cp314t-*.whl

      - name: Verify FT wheel imports
        run: |
          uv run --no-sync python -c "
          import sys
          from redis_rs_py import _driver
          assert not sys._is_gil_enabled(), 'GIL is enabled — not running on free-threaded build'
          print('OK', _driver.__version__, sys.version)
          "
